<style>
:root{--bg:#070c18;--bg2:#050810;--card:#0d1527;--card2:#121b30;--line:#1a2540;--tx:#e8ecf6;--mut:#8b97b4;--acc:#6b8cff;--red:#3a1520;--redtx:#ff8fa0;--dc:#5865f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:linear-gradient(#0a1224,var(--bg2) 85%);background-attachment:fixed;color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px;width:100%}
header{border-bottom:1px solid var(--line);background:rgba(8,13,26,.9);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:14px;font-weight:500;font-size:16px}
.logo{width:40px;height:40px;object-fit:contain}
nav{display:flex;gap:32px;font-size:14px;position:absolute;left:50%;transform:translateX(-50%)}
nav a{color:#c9d1e6}nav a:hover{color:#fff}
.login{background:#5b7cf6;color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;display:flex;gap:8px;align-items:center}
main{flex:1;padding:70px 0 90px}
.inner{max-width:1120px;margin:0 auto}
.back{font-size:14px;color:#c9d1e6;display:inline-flex;gap:8px;cursor:pointer}
.back:hover{color:#fff}
.hero{text-align:center;margin:56px 0 52px}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:40px;font-weight:600;margin:14px 0 18px;letter-spacing:-.5px}
.sub{color:#8fa0d6;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:linear-gradient(var(--card),#0b1222);border:1px solid var(--line);border-radius:18px;padding:20px;display:block;transition:border-color .15s,transform .15s}
.card:hover{border-color:#34457a;transform:translateY(-2px)}
.ico{width:40px;height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:#c9d1e6;margin-bottom:22px}
.card h3{font-size:18px;font-weight:500;margin-bottom:12px}
.tag{display:inline-block;background:var(--red);color:var(--redtx);border:1px solid #5a2030;font-size:11px;padding:3px 9px;border-radius:5px}
.card hr{border:0;border-top:1px solid var(--line);margin:16px 0 14px}
.card small{color:var(--mut);font-size:12.5px}
.thread{max-width:820px;margin:0 auto}
.thread .hero{margin:44px 0 36px}
.thread h1{font-size:34px}
.intro{color:#b9c3dc;line-height:1.7;margin-bottom:34px;text-align:center}
.sec{margin-top:34px}
.sec h2{font-size:19px;font-weight:600;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.item h4{font-size:15.5px;font-weight:600;margin-bottom:8px}
.item h4 span{color:var(--acc);margin-right:10px;font-weight:500}
.item p{color:#b9c3dc;font-size:14.5px;line-height:1.7;margin-top:6px}
.item p b{color:#fff;font-weight:600}
footer{border-top:1px solid var(--line);background:#060a14}
footer .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.fb{display:flex;align-items:center;gap:12px}
.fb .logo{width:32px;height:32px}
.fb b{font-weight:500;font-size:14px;display:block}
.fb em{font-style:normal;color:var(--mut);font-size:12px}
.fr{display:flex;align-items:center;font-size:14px;color:#aab4cf}
.fr>*{padding:0 18px;border-left:1px solid var(--line)}
.fr>*:first-child{border:0}
.fr code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#fff}
.fr .on{color:var(--acc)}
.fr .dcl{color:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}nav{display:none}}
@media(max-width:600px){.grid{grid-template-columns:1fr}footer .wrap{flex-direction:column;height:auto;padding:20px 24px;gap:14px}.fr>*{padding:0 10px}h1{font-size:32px}}
</style>
</head>

{id:"sek1",t:"FiveM-servern | (Sek. 1)",intro:"Denna del av reglerna innehåller bland annat grundregler och andra tillämpningar för att skapa en sån rolig och utvecklande RP som möjligt.",c:`§ 4.1 | Grundregler
a|RDM (Random Deathmatch)|<b>Definition:</b> Innebär att döda eller slå andra spelare utan giltigt bakomliggande scenario.¶<b>Exempel:</b> Du hamnar i bråk med en person, du väljer som första utväg att slå ner honom istället för att prata dig ur bråket.
b|VDM (Vehicle Deathmatch)|<b>Definition:</b> Innebär att använda fordonet som ett vapen för att skada eller döda utan giltigt bakomliggande scenario.¶<b>Exempel:</b> Det står en person på gatan. Du kör på honom, utan någon som helst bra anledning.
c|COPBAIT|<b>Definition:</b> Innebär att du försöker få polisens uppmärksamhet¶<b>Exempel:</b> Du befinner dig vid ett trafikstopp, bredvid dig står en Polis. Du kör mot rött.
d|FEARRP|<b>Definition:</b> Innebär att du inte värnar om ditt liv.¶<b>Exempel:</b> Du åker ensam till en mörk bongård, plötsligt dyker 4 bilar upp med beväpnade män. De riktar på dig, du försöker springa därifrån fast de har vapen mot dig.
e|METAGAMING|<b>Definition:</b> Innebär att du använder information som din karaktär inte vet om.¶<b>Exempel:</b> Du sitter i Discord, din vän berättar att Polisen tagit honom och han visar var han är. Du åker dit.
f|NLR|<b>Definition:</b> Innebär att du minns saker som hände precis innan din karaktär dog.¶<b>Exempel:</b> Du har blivit kidnappad vid ett gänghus, du blir avrättad. Efter din återuppståndelse går du och berättar vem som avrättade dig.
g|COMBAT LOGGING|<b>Definition:</b> Innebär att du loggar ut eller försöker kringgå ett pågående scenario. Efter du dött, ska du vänta 5 minuter och sen trycka på "E" och respawna. Därefter ska du ej vara inne på karaktären. Loggar du ut innan dess är det COMBAT LOGGING.¶<b>Exempel:</b> Du har precis blivit tagen som gisslan i ett bankrån, du loggar ut.
h|POWERGAMING|<b>Definition:</b> Innebär att prioritera sina egna fördelar före ett rättvist och realistiskt spel¶<b>Exempel:</b> Du är med i en bilkrock utan att du rollspelar på skadorna.
i|Sunt Förnuft|<b>Definition:</b> Grunden bakom alla regler. Använd ditt egna omdöme för att fatta beslut som är rättvisa och rimliga för en rolig och realistisk RP. Bygger på Rimlighet, Respekt och Hänsyn.¶<b>Exempel:</b> Du tar och cyklar in i en bilaffär, sen tränger du dig i kön.
j|Social RP|<b>Definition:</b> All RP på servern ska ha sin utgångspunkt i Social RP. Det innebär att du ska i första hand hitta lösningar på saker i RP som involverar Social RP. Att skjuta eller använda våld som första lösning på problem man stöter på i rollspelet, bryter direkt mot denna princip.¶<b>Exempel:</b> Du är med i ett gäng och ska åka och ta över ett Kriminellt område, det är en annan vid området. Du väljer direkt att skjuta honom utan att försöka integrera med honom socialt. Du saknar Social RP.
§ 4.2 | Din karaktär
a|Genomtänkt|Du ska ha en genomtänkt och välplanerad karaktär som är unik och bidrar till staden. Att spela sig själv är oacceptabelt.
b|Skifta mellan Polis och Kriminell|Ifall du spelat din karaktär som Kriminell kan karaktären inte senare bli Polis. Likaså kan inte en polis senare bli grovt Kriminell. Regeln gäller strikt och undantag kan i vissa fall ges ifall man kan uppvisa för Staff att karaktären gjort en progress mellan de olika bitarna.
c|Lall|Karaktärer som endast går ut på att lalla runt på servern utan bakgrundshistoria kommer inte tolereras under några omständigheter.
d|Döden|Ifall din karaktär dör i ett scenario, då gäller 12 timmars-regeln. Det innebär att du inte får spela på karaktären förens 12-timmar sen den dog.¶Kom ihåg att regeln New Life Rule också gäller här.¶Ifall du tar självmord eller är med i ett särskilt scenario där din karaktär fullt avrättas, då ska karaktären tas bort. Det är enbart Staffs som kan ge order ifall en karaktär ska tas bort permanent.
§ 4.3 | Väl i rollspelandet
a|OOC (Out Of Character) In-Game|Det är inte tillåtet att prata OOC In-Game. Väl inne i din karaktär får du tänka på att du befinner dig just i karaktären, du kan inte prata om saker som är utanför dens liv. Det kan t.ex. vara att fråga om någons Discord, eller berätta inne i din karaktär att du spelar på servern Avelia Roleplay. Din karaktär vet enbart att denne befinner sig i staden Avelia, inte servern.
b|Halv-OOC In-Game|Att kringgå OOC reglerna genom att t.ex. använda ord som "sandstorm eller blåa appen" är inte heller tillåtet. Istället ska ni använda chatten Lokal OOC för att kommunicera OOC saker.
c|Kriminell utan Kriminellroll|För att spela som Kriminell på Avelia måste du vara godkänd för det. Det har du genom att du har en såkallad Kriminell Roll i våran Discordserver, där du är med i tillhörande Discords. Det är inte tillåtet att spela Kriminell utan denna roll.
d|Ped utan Ped|För att spela med Ped på Avelia så ska du vara uppskriven med just den peden på Pedlistan samt ha en Pedroll i våran Discordserver. Att spela utan att ha Pedrollen och utan att vara uppskriven på den peden du spelar med är strikt förbjudet och kommer få långtgående följder.
e|Korruption Inom Yrke|Inom normala omständigheter finns absolut ingen tolerans alls för minsta korruption. Korruption som kan skada stadens ekonomi (T.ex. att ta ut pengar ur företagskassan, ge ut saker från polisens beslagtagnaförråd) hanteras med våra allra starkaste medel.
f|Förhandlingar|Vid förhandling där Polis och Kriminella kommer överens om sak, ska saken hållas. Detta innebär att vid t.ex. rån, där en förhandling görs, då ska dealen hållas från båda parter.
g|Tjänstefordon och tjänstevapen|Tjänstefordon och tjänstevapen får endast köras eller användas av behöriga inom yrket som bilen/vapnet tillhör. Detta inkluderar att sno polisbilar, att använda sig av tjänstevapen. Vid större scenarion eller händelser där det går inom ramen för SUNT FÖRNUFT kan denna regel kringgås.
h|Sexuella trakasserier, övergrepp|Det finns inte någon som helst tolerans för sexuella trakasserier eller övergrepp. Att ägna sig åt tafsande, våldtäkter och annat förnedrande kommer besvaras med hårdaste medel. Detta gäller både fysiskt som verbalt, att röra på någons känsliga kroppdelar men också använda ord som "Hora, slyna" faller inom denna regel.
§ 4.4 | Generella Regler
a|Duping|Duping innebär att du använder en bugg för att skapa eller föröka föremål. Dupes måste omgående rapporteras in till Staffs. Att ägna sig åt Duping, vare sig du genomför det eller bara tar emot kommer att besvaras med de allra hårdaste medlen. Ifall man misstänker att man tagit emot en orimligt hög summa pengar, eller fått föremål som man misstänker Dupats fram måste man med omedelbar verkan kontakta Staffs.
b|Bug Abuse|Att använda Buggar i spelet är inte tillåtet. De ska likt Dupes med omedelbar verkan rapporteras in till Staffs.
c|Tredjepartsmjukvaror, Mod Menyer|All form av tredjepartsmjukvara som ger minsta fördel är strikt förbjuden. Detta inkluderar grafikmod som innehåller: No Water, No Bushes, No Props, All Day All Night, Custom Crosshair, Blood Effects och Tracers. Vi jobbar nära med anticheat-partners som konstant utvecklar sina förmågor för att upptäcka fuskare och automatiska avstängningar tas inte heller bort. Vi förbehåller oss också rätten att utan förvarning göra spontana pc-checks vid misstanke om fusk.
§ 4.5 | Chatter
a|Lokal OOC|Lokal OOC har som syfte att vara en chatt för att skriva med spelarna runt omkring dig OOC. Det vill säga att det är tillåtet att gå utanför sin Karaktär. Chatten får dock inte under några omständigheter användas för att påverka scenarion, gnälla över scenariot, anmäla regelbrott eller berätta information som kan användas för META GAMING.
b|OOC|Den Globala OOC chatten ska enbart användas för att uppmärksamma viktig OOC information som berör alla spelare på servern.
c|Twitter, Blocket och Annonsering|Dessa är RP-chatter, vilket innebär att alla ovanstående RP-regler tillämpas i dessa chatter, såsom OOC In-Game. Här är inte Kriminalitet under några omständigheter tillåtet. Inte heller hints till Kriminalitet. Använd rätt kanal för rätt sak.`},

{id:"sek2",t:"Discordservern | (Sek. 2)",intro:"Discordservern används som hjälpmedel till gemenskapen för att underlätta kommunikation utanför rollspelandet och står för huvuddelen av gemenskapen där alla delaktiga möts. För oss är det väldigt viktigt att skapa en trygg och trevlig plats, oavsett om man befinner sig på Discord för att ta del av information eller för att skaffa nya vänner.",c:`§ 2.1 | Chattregler
a|Använda rätt chatter|<b>Definition:</b> Du ska använda rätt chatt till rätt ärende eller syfte.¶<b>Exempel:</b> Du ska till exempel inte skicka bilder i generellt eller chatt kanalen utan bilder ska skickas i bilder kanalen.
b|Diskussion av bans|<b>Definition:</b> Målet med discorden är att vara en plats där man kan diskutera och sprida sina idéer och tankar med andra. Djupare diskussioner bör alltid hållas i kanalen Diskussion. Alla diskussioner som endast ett fåtal individer deltar i bör hållas utanför Avelias discord under alla omständigheter och inte diskuteras på våran discord.¶<b>Exempel:</b> Du ska exempelvis inte diskutera folks bans i en öppen kanal.
c|Upprätthålla ordningen|<b>Definition:</b> Innebär att du inte ska spamma, överanvända emojis, skriva i capslock eller smutskasta andra i repkanalen.¶<b>Exempel:</b> Du skickar inte en -rep som är endast smutskastning ex: "@vAlexx är skit han kan ingenting"
§ 2.2 | Röstkanaler
a|Vårdlöst beteende|Du ska inte hoppa in och ut mellan kanaler för att producera, inte heller hoppa in i stör ej kanaler utan tillåtelse.
b|Voice Changer|Det är ej tillåtet att ha voice changer i Discord kanalerna. Kom ihåg att stänga av de ifall du använder det ingame.
§ 2.3 | Innehåll & Media
a|Olagligt eller olämpligt innehåll|Delning av olagligt, stötande eller NSFW-material (t.ex. pornografiskt, rasistiskt, diskriminerande eller våldsamt innehåll) är förbjudet.
b|Reklam & Länkar|Det är inte tillåtet att marknadsföra andra servrar, communities eller produkter utan tillåtelse från staff.¶<b>Exempel:</b> Du får inte posta inbjudningslänkar till andra Discordservrar i Avelias chattar.
§ 2.4 | Integritet & Sekretess
a|Delning av personlig information|Du får inte dela andras (eller din egen) personliga uppgifter som adress, IP, bilder eller annat identifierande utan samtycke.
b|Inspelningar & Skärmdumpar|Det är inte tillåtet att spela in, streama eller ta skärmdumpar från röstkanaler utan allas godkännande.
§ 2.5 | Din profil
a|Profilbild och Banner|Det är inte tillåtet att ha profilbilder eller banners som är kränkande (Rasistisk eller provocerande), sexuellt explicita eller olämpliga.
b|Namn|Det är inte tillåtet att ha kränkande (Rasistisk eller provocerande), sexuellt explicita eller olämpliga namn. Ditt namn får inte heller vara blankt eller med oanvändbara symboler. Vill du döpa ditt Discord smeknamn efter din karaktär så måste du heta t.ex. buster | Karl åkesson för att inte försvåra jobbet för oss staffs.`},

{id:"sek3",t:"Kriminell | (Sek. 3)",intro:"Denna del av reglerna innehåller specifika regler som riktar sig mot de Kriminella på servern. Målet med dessa regler är att uppnå en sån rolig och realistisk Kriminell RP som möjligt.¶Med Kriminell avser vi någon som rollspelar en karaktär som är Kriminell på Avelia Roleplay samt innehar Kriminell-rollen på våran Discordserver.",c:`§ 5.1 | Att vara Kriminell
a|Diskret|Som Kriminell ska du i grunden vara diskret. Ifall du är med i ett gäng ska du hålla dig till gängets kultur.¶När du ägnar dig åt Kriminella aktiviteter ska mask vara på.
b|Kreativitet|Förutsättningarna för en bra Kriminell RP grundar sig i våran kreativa förmåga. Att skapa kreativa scenarion som inte är trångsynta.¶Bredda vyerna och försök skapa något nytt som gör det roligt.
c|Provokationer|Att provocera eller söka konflikter med andra Kriminella är inte tillåtet.¶Det är inte under några som helst omständigheter tillåtet att befinna sig utanför fiendens gäng hus för att provocera.
d|Snabbt in, Snabbt ut|Som Kriminell ska du ha i åtanke att varje sekund räknas och kan vara på liv eller död.¶Detta ska du återspegla i din RP, vid till exempel en skottlossning, driveby eller stormning.
e|Polisen|Det sista du vill som Kriminell är att hamna i trubbel med Polisen.¶Därför ska man ha ett diskret förhållningsätt till Polisen, vilket innebär att man inte ska avslöja sin Kriminalitet eller Gäng/Organisation.¶Som Kriminell ska ni också hålla en tystnadskultur gentemot Polisen, vilket innebär att man inte blandar in Polisen i sina konflikter med andra Kriminella. Det är inte acceptabelt att till exempel ringa Polisen för att sätta fienden i problem med dem.
§ 5.2 | Scenarion
a|Personrån|Personrån får ej ske på civila som befinner sig vid icke-kriminella områden eller som du ej har anledning att råna.¶Vid personrån får du inte avrätta offret. De ska alltid ha möjligheten att värna om sitt liv.
b|Kidnappning|Kidnappning ska endast ske som en följd av tidigare scenario. Det kan t.ex. vara ett medel under pågående gängkrig. Krav inom kidnappning ska vara rimliga för att inte överskrida regeln Fear RP § 4.1d.
c|Lämna Gäng|När du lämnar ett gäng måste du göra ett scenario In-Game. Lösningar utanför som i Discord tolereras inte under några omständigheter.
d|Döda kroppar|Eftersom att lik är just döda kroppar, vilket utgångspunkten måste vara att det ej är återupplivbart, kan de ej ha ett värde i en förhandling. Det är inte tillåtet att förhandla om lik.
e|Hantering av döda kroppar|Som nämnt i regeln § 5.1d så är just snabbheten en faktor. Detta minimerar dina chanser att avslöja dig och lämna fotspår.¶Vad som också gör det är hur man hanterar kropparna. När man rör kropparna riskerar man att lämna DNA på dem. Men också att ifall du har lik liggandes vid ditt gänghus, det skapar också problem.¶<b>Hantering av lik utifrån dess läge</b> Ifall kroppen ligger på område ni kontrollerar (t.ex. gänghus) → Tillåtet att loota, kroppen ska dumpas/brännas.¶Ifall kroppen ligger på område som ni ej kontrollerar (t.ex. vid fiendens gänghus eller på offentlig gata) → Ska ej röras, lämna platsen omgående
f|Krig|Gängkrig ska precis som allt annat beväpnat våld ha sin bakgrund i längre tids sociala konflikter. För att ett krig ska startas måste det finnas en realistisk grund och motivering.¶Under krig ska överanvändning av våld undvikas, istället bör man utföra scenarion så som kidnappningar och andra sociala aktiviteter som en brygga mellan sociala scenarion samtidigt som det utvecklar rollspelet och krigets utveckling.¶Krigsföring ska inte ske i bilar utan ska ske på mark om det inte är en livshotande eller absolut nödvändig situation att använda bilen. Att använda bilar som ett vapen, för att t.ex. utföra pittningar är strikt förbjudet. Bilars roll i gängkrig ska huvudsakligen handla om att följa efter fienden.¶"Shoot on Sight" eller att skjuta utan försök till Social RP är totalförbjudet med 1 undantag - ifall du är med i ett gäng och du har fått order från din Boss i gänget att utföra ett sådant. Bossen måste i det läget noga grunda beslutet om det är lägligt och rimligt att gänget utför ett sådant scenario mot fienden. Ifall skälen är ogiltiga eller om tillstånd ej finns, då kommer det istället räknas som en RDM (§4.1a) och få stora konsekvenser för hela gänget. Det gäller enbart Bossar och ej Vice-Bossar eller övriga ansvariga inom gängorganisationen. Bossen får enbart godkännande till Max 1 Shoot on Sight scenario om dagen, räknas från datumet. Det vill säga enbart 1 Shoot on Sight scenario får göras exempelvis 2023-11-01 för gänget X. Bossen bör inte själv utföra såna scenarion utan de bör beordra Springisar.¶Civila ska inte blandas in i kriget. Kriget måste också ta ett slut och för stridande parter så måste man ha som ambition att hitta en lösning. Att kriga enbart för glädjens skull är ett direkt regelbrott mot POWERGAMING (§4.1h) samt denna krigsregel.
g|Stormning|Att storma fiendens gänghus får endast ske med order från Boss i gänget du är med i.¶Bossen får endast tillåta stormning på rimliga och realistiska skäl. Att ge order om stormning flertal gånger i veckan kommer få stora konsekvenser.¶Det gäller enbart Bossar och ej Vice-Bossar eller övriga ansvariga inom gängorganisationen.¶Att storma utan tillåtelse från Bossen innebär brott mot denna regel. Att ge godkännande till stormning som Boss utan tillräckliga grunder eller utan väntetid emellan kommer leda till nedstängning av gänget som företräds samt brott mot denna regel.¶Ifall flertal gängmedlemmar stormar utan tillåtelse från sin Boss kommer det också få konsekvenser för hela gänget då det uppvisar brist på struktur och ordning inom gängorganisationen. Ifall ett allierat gäng bjuder in till en stormning de avser genomföra, ska du också ha godkänt av din Boss att delta på den stormningen.
h|Driveby|En Driveby ska ske snabbt in och snabbt ut. Att stanna kvar på platsen eller gå ut ur bilen för att loota, är aldrig tillåtet under Driveby-scenario.¶Driveby räknas som "Shoot on Sight" eftersom det ej ger egentliga möjligheter till Social RP. Därför ska ett sådant scenario enligt krigsregeln (§ 5.2f) vara godkänt av Boss för gänget man företräder i kriget. Bossen får enbart ge godkännande till Max 1 Shoot on Sight scenario om dagen, räknas från datumet. Det vill säga enbart 1 Shoot on Sight scenario får göras exempelvis 2023-11-01 för gänget X. Bossen bör inte själv utföra såna scenarion utan de bör beordra Springisar.
i|Fritagning|Fritagning ska planeras i förväg på ett logiskt och rimligt sätt. Spontana fritagningar är inte tillåtna.¶Du måste ha en genomtänkt plan och en fritagning får aldrig ske på ett sådant sätt som riskerar någon annans eller ditt eget liv. Detta kan t.ex. vara att göra en skott-fritagning, bryter också mot Social RP (§ 4.1j).¶Du får endast frita någon som sitter mer än 8 timmar (realistisk tid) i fängelse.¶Scenariot ska vara godkänt av Kriminell Ansvariga.
k|Gisslan|Gisslor får inte vara ens egna eller allierade, du ska vara beredd att ta livet av den som du tar som gisslan. Det är inte heller acceptabelt att ta tjänstemän så som Poliser, Sjukvårdare, Brandmän och Securitasvakter som gisslan.`},

{id:"sek4",t:"Community | (Sek. 4)",intro:"Grundidén bakom communityreglerna är att främja sammanhållning inom gemenskapen. Här på Avelia strävar vi efter att skapa en inkluderande miljö där alla känner sig välkomna. Ett varmt community där alla medlemmar bidrar och vi växer tillsammans.¶Med \"Community\" avses vår Discord-server, vårt forum samt FiveM-servern.",c:`§ 1.1 | Du & Communityt
a|Bidragande|Bidra till servern och communityt utifrån din egen förmåga och verka alltid för att förbättra det.
b|Ansvar|Visa ansvarstagande för servern och communityt genom att rapportera eventuell korruption, regelbrott eller annan viktig information till staff.
c|Utveckling|Bidra med nya idéer för servern och communityts utveckling och rapportera kritiska buggar.
§ 1.2 | Du & Andra Medlemmar
a|Respekt|Visa alltid respekt mot andra medlemmar. Undvik kränkande eller nedvärderande kommentarer.
b|Toxicitet|Behåll en välvillig ton och undvik misstänksamhet, aggressivitet eller provokationer.
c|Personangrepp|Undvik personangrepp och fokusera på sakfrågor i diskussioner.
d|Känslig Information / DoXing|Respektera andra medlemmars önskan om anonymitet och dela inte känslig information utan deras tillstånd.
e|Hotande & Utpressning|Undvik hot och utpressning.
f|Rasism/Nazism|Inga rasistiska eller nazistiska uttryck är tillåtna, och undvik diskriminering baserad på religion, etnicitet eller kön.
g|Smutskastning|Undvik smutskastning mot andra medlemmar.
h|Kritik|Ge konstruktiv kritik och undvik nedvärderande, anklagande eller kränkande uttryck.
i|Dating|Servern ska inte användas som en mötesplats för dejting; vi är här för att spela.
j|Medlare|Du ska inte agera som medlare i andras ärenden, vilket innebär att springa på andras ärenden. Du får inte beblanda dig i andras bans.
§ 1.3 | Du & Staff
a|Respekt|Visa alltid respekt mot staff och undvik att överrösta, använda olämpliga uttryck eller nedvärdera deras roll på servern.
b|Resonlighet|Var resonabel i ditt samarbete med staff och sträva efter lösningar. Kom ihåg att staffen alltid har det sista ordet.
§ 1.4 | Generella Regler
a|Reklam|Använd inte communityt eller servern som en plattform för reklam för andra servrar eller aktiviteter utanför servern och communityt.
b|Kriminalitet|Använd inte communityt eller servern som en plattform för kriminell verksamhet eller handlingar som strider mot svenska lagar.
c|Sälja ingame saker för irl pengar / Använda ett externt donationssystem|Använd inte communityt eller servern som ett sätt att tjäna egna pengar på, detta är brott mot både serverns regler men kan också leda till andra rättsliga konsekvenser.`},

{id:"sek5",t:"Gäng | (Sek. 5)",intro:"Denna del av reglerna gäller gäng och grupperingar på Avelia Roleplay.",c:`§ 6.1 | Discord
a|Användning av krig, allians kanaler|När ditt gäng påbörjar eller avslutar en allians skall det dokumenteras i gängets allians kanal. Detta gäller även när ditt gäng påbörjar eller avslutar ett krig, då skall det dokumenteras i gängets "krig" kanal.
b|Gäng roller|För att hålla en så hög och seriös nivå som möjligt har vi bestämt att det är totalt förbjudet att inneha en eller flera roller med ett namn som kan ses som lalligt, oseriöst eller kränkande.
§ 6.2 | Struktur
a|Aktivitet och engagemang|Gänget ska vara tydligt aktivt. Det ska finnas ett engagemang från gänget IC såväl som tillgänglighet OOC. Ifall bossen i gänget är tillfälligt frånvarande bör bossen utse ansvarig person att hålla gänget aktiv under frånvaron. Ifall detta inte sker och gänget förblir inaktivt under längre tid kommer gänget slutligen stängas ned i enighet med denna regeln. Det är gänget som är ansvarigt att rapportera inaktivitet till Kriminell Ansvariga.
b|Antalet platser i ett gäng|För att rollspelet ska hålla en så hög nivå som möjligt måste det sättas en gräns på hur många medlemmar det får vara i ett gäng. Alla typer av gäng får ha max 18 stycken medlemmar förutom MC klubbar som får ha max 20 stycken medlemmar.
c|Gäng Inriktning|Att ha en tydlig struktur och kultur inom ditt gäng innebär också att använda sig utav kläder och bilar som är representativt och passande för gänget.
d|Allianser|Gäng kan ingå i allianser. Allianser av gäng kan hjälpa och stötta varandra i olika scenarion, t.ex. krig. Det finns en gräns på tre (3) allianser — utgå från sunt förnuft. Enligt denna definition så räknas man att vara allians ifall man assisterar varandra under krig. Gänget får därmed inte assistera andra gäng utanför alliansen i sådana scenarion.
§ 6.3 | Fordon
a|Fordonets syfte|Gängbilarnas syfte är att visa upp gängets kultur och status i staden och får inte användas som syfte att vinna scenarion genom t.ex. hastighet eller kraft.
b|Diskrethet|Gängbilar ska vara diskreta och inte avslöja gänget, gängets namn får inte finnas på bilen. Alias kan vara tillåtet.
§ 6.4 | Scenarion
a|Stormning|Ett gäng får inte utföra en stormning på ogiltiga grunder, men får inte heller utföra mer än 1 stormning under en veckas tid mot samma gäng. Första stormningen i veckan får godkännas av gängets boss, en andra måste godkännas av Kriminell Ansvarig. Sker en stormning utan godkännande eller dokumentation räknas det som ogiltigt och leder alltid till minst en gängvarning.
b|Krig|Ett gängkrig ska precis som allt annat beväpnat våld ha sin bakgrund i längre tids sociala konflikter. För att ett krig ska startas måste de gäng som uppmanar till krig ha en realistisk grund och motivering.`},

{id:"sek6",t:"Forum | (Sek. 6)",intro:"För att skapa en trevlig och välordnad miljö på forumet gäller följande riktlinjer.",c:`§ 3.1 | Överklaganden av bannlysningar
a|24-timmarsregel|Du kan endast skicka in ett överklagande per 24 timmar.¶<b>Exempel:</b> Skicka inte flera överklaganden inom samma dygn.
b|Tagga inte staff|Du ska inte direkt tagga någon staffmedlem i ditt överklagande. Staffteamet tar hand om hanteringen.¶<b>Exempel:</b> Skicka din överklagan och vänta tills en staffmedlem taggar den som utfärdat bannen.
c|Korrekt banbild|Överklagandet måste innehålla en skärmbild av banmeddelandet som visas när du försöker ansluta.¶<b>Exempel:</b> Bifoga bilden av själva bannen, inte något annat meddelande.
d|Riktig information|Ange alltid korrekt information i ditt överklagande.¶<b>Exempel:</b> Korrekt Steam Hex-ID och Discord-namn måste anges.
§ 3.2 | Anmälningar
a|Bevis krävs|Alla anmälningar måste åtföljas av bevis.¶<b>Exempel:</b> Vid regelbrott, bifoga en skärminspelning som visar händelsen.
b|Låt staff hantera ärenden|Försök inte påskynda behandlingen av anmälningar. Staffteamet tar hand om processen.¶<b>Exempel:</b> Skicka in din anmälan och vänta tålmodigt på handläggning.
§ 3.3 | Bemötande
a|Respektfullt uppförande|Håll alltid en vänlig och respektfull ton mot andra användare.¶<b>Exempel:</b> Undvik att skriva otrevliga kommentarer på andras profiler.
b|Språk|Använd ett vårdat språk på forumet.¶<b>Exempel:</b> Skriv på svenska och undvik olämpliga ord.
§ 3.4 | Ansökningar
a|Egna ansökningar|Plagiering av andras ansökningar är förbjudet och leder till omedelbar avslag.¶<b>Exempel:</b> Formulera din ansökan med dina egna ord.
b|Max en ansökan per dag|Du kan inte skicka flera ansökningar samma dag. Om din ansökan nekas, vänta 24 timmar innan du skickar in en ny.¶<b>Exempel:</b> Om din chefsansökan nekas, invänta 24 timmar innan en ny ansökan.
c|Bump av ansökan|Du kan "bumpa" din ansökan för att visa att den fortfarande är aktuell, men endast en gång per 24 timmar.¶<b>Exempel:</b> Om du skickade in en staffansökan för tre dagar sedan kan du skriva !bump en gång för att visa att den fortfarande gäller.
§ 3.5 | Forumsprofil
a|Lämplig profilbild och banner|Din profilbild och banner ska vara passande och får inte vara stötande, sexuellt explicit eller olämplig.¶<b>Exempel:</b> Välj en neutral eller trevlig bild, till exempel på ditt husdjur.
b|Signaturer|Signaturer får inte innehålla olämpligt material, överdrivet mycket text, bilder, animationer eller reklam.¶<b>Exempel:</b> En kort text eller citat är okej, men inte blinkande GIF:ar eller stora bilder.
c|Profilidentitet|Du får inte utge dig för att vara någon annan användare, staffmedlem eller välkänd person.¶<b>Exempel:</b> Skapa inte en profil som heter "Ägare buster" eller liknande ifall du inte är en personal.
d|Länkar i profil|Du får endast länka till personliga sidor som är säkra och relevanta. Länkar till andra communities, servrar eller reklamsidor är förbjudna.¶<b>Exempel:</b> En länk till din Twitch-kanal är okej, men inte till en annan RP-server.
e|Användarnamn och visningsnamn|Ditt användarnamn ska vara lämpligt och får inte innehålla stötande, provocerande, diskriminerande eller vilseledande innehåll.¶<b>Exempel:</b> Namn som "Hitler" är inte tillåtna.
f|Flera konton (alts)|Det är inte tillåtet att skapa eller använda flera profiler på forumet utan tillstånd från Ledningen.¶<b>Exempel:</b> Du får inte skapa ett alt konto för att ge +rep eller annat på din egen ansökan eller undvika bans/varningar osv. Ifall du får problem med att logga in på ditt main-konto så bör du kontakta @vAlexx
§ 3.6 | Allmänna regler och säkerhet
a|Falska uppgifter|Att medvetet lämna felaktig information i överklaganden, anmälningar eller ansökningar kan leda till varning eller avstängning.¶<b>Exempel:</b> Om du anger ett felaktigt Steam Hex-ID för att undvika bann, kan du få ytterligare sanktioner.
b|Olovlig delning av material|Dela inte andras skärmdumpar, privata meddelanden eller bevis utan tillstånd.¶<b>Exempel:</b> Skicka inte någon annans Discord-meddelanden i forumtrådar.
c|Spam och dubbelpostning|Undvik att posta samma innehåll flera gånger på forumet.¶<b>Exempel:</b> Skicka inte samma fråga eller ansökan i olika trådar.
d|Hantera konflikter privat|Försök lösa personliga tvister via privata meddelanden innan du eskalerar till staff eller gör en formell anmälan.¶<b>Exempel:</b> Om du har en mindre konflikt med en användare, prata med dem först innan du skickar in en anmälan.
e|Forumets ansvar|Staffteamet har sista ordet i alla ärenden. Deras beslut är slutgiltiga och ska respekteras.¶<b>Exempel:</b> Om din överklagan nekas, acceptera beslutet utan att skapa konflikt.
f|Säkerhet och kontodelning|Du ansvarar själv för ditt konto.¶<b>Exempel:</b> Lämna inte ut dina inloggningsuppgifter till någon annan.`}
];

const app=document.getElementById("app");
const paras=s=>s.split("¶").map(p=>`<p>${p}</p>`).join("");
const esc=s=>s.replace(/&(?!amp;)/g,"&amp;");
const docIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>';

function list(){
  app.innerHTML=`<div class="hero" style="margin-top:0"><div class="eyebrow">Regler</div><h1>Trådar</h1><div class="sub">Server-, Discord- och rollspelsregler.</div></div>
  <div class="grid">${T.map(x=>`<a class="card" href="#/${x.id}"><div class="ico">${docIcon}</div><h3>${x.t}</h3><span class="tag">Regler</span><hr><small>Uppdaterad 10 april 2026</small></a>`).join("")}</div>`;
}
function thread(x){
  let html="",open=false;
  x.c.split("\n").forEach(l=>{
    if(l.startsWith("§")){if(open)html+="</div>";html+=`<div class="sec"><h2>${l}</h2>`;open=true}
    else{const[a,t,...r]=l.split("|");html+=`<div class="item"><h4><span>${a}.</span>${esc(t)}</h4>${paras(r.join("|"))}</div>`}
  });
  if(open)html+="</div>";
  app.innerHTML=`<a class="back" href="#/">← Tillbaka till regler</a>
  <div class="thread"><div class="hero"><div class="eyebrow">Regler</div><h1>${x.t}</h1><div class="sub">Senast uppdaterad 10 april 2026</div></div>
  <div class="intro">${paras(x.intro)}</div>${html}</div>`;
}
function route(){
  const id=location.hash.replace("#/","");
  const x=T.find(t=>t.id===id);
  x?thread(x):list();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
